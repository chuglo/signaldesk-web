[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signaldesk-web"
version = "0.1.0"
description = "SignalDesk skeleton for signaldesk-web"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "Flask==3.1.0",
    "httpcore>=1.0,<2",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.7,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/signaldesk_web"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
