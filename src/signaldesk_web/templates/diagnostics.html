<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Diagnostics — SignalDesk</title></head>
  <body>
    <main>
      <h1>Run diagnostic</h1>
      {% if error %}<p role="alert">{{ error }}</p>{% endif %}
      <form method="post" action="{{ url_for('diagnostics.index') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>Target <input name="target" type="text" maxlength="2048" required></label>
        <button type="submit">Run diagnostic</button>
      </form>
    </main>
  </body>
</html>
