<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in — SignalDesk</title>
  </head>
  <body>
    <main>
      <h1>Sign in</h1>
      {% if error %}<p role="alert">{{ error }}</p>{% endif %}
      <form method="post" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>Email <input name="email" type="email" maxlength="320" required autocomplete="username"></label>
        <label>Password <input name="password" type="password" maxlength="1024" required autocomplete="current-password"></label>
        <label>Organization ID <input name="organization_id" type="text" maxlength="36" required autocomplete="off"></label>
        <button type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
